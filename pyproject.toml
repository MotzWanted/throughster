[project]
name = "throughster"
version = "0.0.1"
description = "Throughster optimizes and standardizes API interactions with large language models through advanced HTTP connection pooling and HuggingFace .map support for efficient multiprocessing."
authors = [
    { name = "Andreas Geert Motzfeldt", email = "andreas@motzfeldt.dk" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "httpx>=0.27.0",
    "openai>=1.37.1",
    "tenacity<=8.5.0",
    "pydantic>=2.7.3",
    "docstring-parser>=0.16",
    "fastapi>=0.111.1",
    "loguru>=0.7.2",
    "numpy<2.0.0",
    "pydantic-settings>=2.3.2",
    "aiocache>=0.12.2",
    "aiofilecache>=0.0.1",
    "orjson>=3.10.16"
]

[dependency-groups]
dev = [
    "rich>=13.7.0",
    "ruff>=0.1.8",
    "ipykernel>=6.28.0",
    "jupyter>=1.0.0",
    "stackprinter>=0.2.11",
    "ipython>=8.26.0",
]

test = [
    "pre-commit>=3.8.0",
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "typeguard>=4.2.1",
    "requests>=2.31.0",
    "pytest-asyncio>=0.24.0",
]

examples = [
    "datasets>=2.19.2",
]

[tool.uv]
default-groups = ["dev", "test"]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "D",
    "UP",
    "YTT",
    "ASYNC",
    "S",
    "BLE",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "DJ",
    "EM",
    "EXE",
    "FA",
    "ISC",
    "ICN",
    "LOG",
    "PIE",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TCH",
    "INT",
    "ERA",
    "PGH",
]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".hg", ".mypy_cache", ".nox", ".pants.d", ".pytype", ".ruff_cache", ".svn",
    ".tox", ".venv", "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules", "venv",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.codespell]
skip = "*.pdf,*.ipynb,*.drawio,*.json"
ignore-words-list = ["instanciate"]

[tool.typos.default.extend-identifiers]
arange = "arange"

[tool.typos.default.extend-words]
Ue = "Ue"
Hashi = "Hashi"
